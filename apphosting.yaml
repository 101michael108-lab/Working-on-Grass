# Firebase App Hosting — production & preview environment variables
# https://firebase.google.com/docs/app-hosting/configure
#
# Local development: copy .env.example → .env.local
# See docs/ENVIRONMENT.md

runConfig:
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://workingongrass.co.za
    availability:
      - BUILD
      - RUNTIME

  # Firebase Auth UIDs allowed to access /admin (comma-separated, no spaces required)
  - variable: ADMIN_UIDS
    value: SRSc2O7T4XOnTe8ehJMl8oXLtwz2
    availability:
      - RUNTIME

  # PayFast ITN + signature (server-only)
  # firebase apphosting:secrets:set payfast-passphrase
  - variable: PAYFAST_PASSPHRASE
    secret: payfast-passphrase
    availability:
      - RUNTIME
