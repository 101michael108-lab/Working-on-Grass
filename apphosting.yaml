# Firebase App Hosting — production & preview environment variables
# https://firebase.google.com/docs/app-hosting/configure
#
# All production secrets and public env vars belong HERE (not in git values).
# Local development uses .env.local — see docs/ENVIRONMENT.md

runConfig:
  maxInstances: 1

env:
  # Canonical public URL (PayFast callbacks, emails, SEO metadataBase)
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://workingongrass.co.za
    availability:
      - BUILD
      - RUNTIME

  # PayFast ITN + signature (server-only)
  # Create once: firebase apphosting:secrets:set payfast-passphrase
  - variable: PAYFAST_PASSPHRASE
    secret: payfast-passphrase
    availability:
      - RUNTIME

  # Sandbox merchant credentials — only needed when settings/config has isLiveMode: false
  # on the hosted environment. Live merchant ID/key live in Firestore settings/config.
  # Uncomment and set secrets if you run sandbox checkout on App Hosting:
  # - variable: NEXT_PUBLIC_PAYFAST_SANDBOX_MERCHANT_ID
  #   secret: payfast-sandbox-merchant-id
  #   availability:
  #     - BUILD
  #     - RUNTIME
  # - variable: NEXT_PUBLIC_PAYFAST_SANDBOX_MERCHANT_KEY
  #   secret: payfast-sandbox-merchant-key
  #   availability:
  #     - BUILD
  #     - RUNTIME
