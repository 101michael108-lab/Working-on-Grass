# Firebase App Hosting — production & preview environment variables
# https://firebase.google.com/docs/app-hosting/configure
#
# Local development: copy .env.example → .env.local
# See docs/ENVIRONMENT.md

runConfig:
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://workingongrass.co.za
    availability:
      - BUILD
      - RUNTIME

  # Firebase Auth UIDs allowed to access /admin (comma-separated, no spaces required)
  - variable: ADMIN_UIDS
    value: SRSc2O7T4XOnTe8ehJMl8oXLtwz2
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_ADMIN_UIDS
    value: SRSc2O7T4XOnTe8ehJMl8oXLtwz2
    availability:
      - BUILD
      - RUNTIME

  # PayFast ITN + signature (server-only)
  # firebase apphosting:secrets:set payfast-passphrase
  - variable: PAYFAST_PASSPHRASE
    secret: payfast-passphrase
    availability:
      - RUNTIME

  # Email sending (Resend). The outbox in Firestore is unchanged; these decide
  # who sends it. With RESEND_API_KEY unset the Firebase Trigger Email
  # extension keeps sending, so this is safe to deploy before the key exists.
  #
  #   firebase apphosting:secrets:set resend-api-key
  #
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability:
      - RUNTIME

  # Must be an address on a domain verified in Resend, or Resend refuses it.
  - variable: EMAIL_FROM
    value: "Working on Grass <orders@mail.workingongrass.co.za>"
    availability:
      - RUNTIME

  # Optional override: "resend" or "extension". Unset picks resend whenever
  # RESEND_API_KEY is present. Set it to "extension" to fall back without
  # removing the key.
  # - variable: EMAIL_TRANSPORT
  #   value: resend
  #   availability:
  #     - RUNTIME
